[accessibility]
ui_scale = 1.2000000104308128

[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.36999999172985554
tint_intensity = 0.99999997764825821

[bar.default]
background_opacity = 0.69999998435378075
center = ["active-workspace"]
contact_shadow = true
end = [
  "recorder",
  "brightness",
  "output_volume",
  "input_volume",
  "notifications",
  "tray",
  "battery",
  "date",
  "session",
]
font_weight = 200
margin_ends = 0
position = "right"
radius_bottom_right = 0
radius_top_right = 0
scale = 1.350000012665987
shadow = false
start = [
  "cat",
  "widget",
  "caffeine",
  "network",
  "bluetooth",
  "weather",
  "wallpaper",
  "media",
  "privacy",
  "bar",
  "mail",
  "toggle",
]
thickness = 47

[brightness]
enable_ddcutil = true

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000001"]

[desktop_widgets.grid]
cell_size = 8
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000001]
box_height = 112.0
box_width = 184.0
cx = 154.5
cy = 115.5
output = "eDP-1"
placement_height = 960.0
placement_width = 1707.0
rotation = 0.0
type = "clock"

[dock]
background_opacity = 1.0

[hot_corners]
enabled = true

[hot_corners.top_right]
action = "none"

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[keybinds]
down = ["Down", "Ctrl+n"]
up = ["Up", "Ctrl+p"]
validate = ["Return", "KP_Enter"]

[lockscreen]
allow_empty_password = true
blur_intensity = 0.59999998658895493

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 854.0
cy = 778.00006103515625
output = "eDP-1"
placement_height = 960.0
placement_width = 1707.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[notification]
background_opacity = 1.0
border = false
offset_y = 15
position = "bottom_right"

[osd]
background_opacity = 0.90000000000000002
border = false
position = "top_center"
position_vertical = "center_left"
scale = 0.80000000000000004

[plugin_settings."h-jangra/keyviz"]
enabled_by_default = false
max_keys = 7
timeout_ms = 1000

[plugin_settings."noctalia/screen_recorder"]
audio_codec = "flac"
color_range = "full"
copy_to_clipboard = true
frame_rate = 170
replay_duration = 1800
replay_storage = "disk"
video_codec = "hevc"
video_qp = 0

[plugins]
enabled = [
  "dotnetrob/cat",
  "salemsayed/niri-active-workspace",
  "raycursive/niri-displays",
  "radimous/prismlauncher-instances",
  "noctalia/screen_recorder",
  "mirei124/bangumi-progress",
]

[shell]
button_borders = false
card_borders = false
clipboard_history_max_entries = 10000
font_family = "Source Han Serif SC"
input_borders = false
lang = "zh-Hans"
launch_apps_as_systemd_services = true
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
popup_borders = false
screen_time_enabled = true
settings_window_translucent = true

[shell.animation]
speed = 2.0000000298023224

[shell.panel]
borders = false
open_near_click_control_center = true
transparency_mode = "glass"
wallpaper_placement = "floating"
wallpaper_position = "center"

[shell.screenshot]
confirm_region = true
remember_last_region = true

[shell.shadow]
direction = "down_right"

[theme]
builtin = "Catppuccin"
community_palette = "Ayu Blue"
# auto follows the day/night schedule of [location] (set at runtime in
# settings.toml) and writes color-scheme, which GTK4 follows; GTK3 is switched
# by the hooks in ./default.nix.
mode = "auto"
source = "builtin"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = false

[wallpaper.automation]
enabled = true

[widget.active-workspace]
capsule = true
capsule_opacity = 0.5
label_mode = "index"
type = "salemsayed/niri-active-workspace:active-workspace"

[widget.active-workspace.actions]
right = "panel-toggle raycursive/niri-displays:panel"

[widget.bar]
capsule = true
capsule_opacity = 0.5
type = "mirei124/bangumi-progress:bar"

[widget.battery]
hide_when_plugged = true
show_label = false

[widget.brightness]
interactive = true
show_label = false

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.cat.actions]
left = "panel-toggle tordex/nvtop:panel gpu"

[widget.date]
scale = 0.75
vertical_format = "{:%H\\n%M\\n-\\n%m\\n%d}"

[widget.input_volume]
show_label = false

[widget.mail]
type = "mdj2812/thunderbird-companion:mail"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.output_volume]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.sysmon]
show_value = false

[widget.toggle]
type = "0lucasmatheus/awwwall:toggle"

[widget.tray]
drawer = true
pinned = ["Fcitx"]

[widget.weather]
show_temperature = false

[widget.widget]
type = "h-jangra/keyviz:widget"

[widget.workspaces]
hide_when_empty = true
style = "focus_hint"
