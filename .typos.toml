[files]
ignore-global = true
ignore-parent = true
ignore-hidden = false
ignore-files = true
ignore-vcs = true
extend-exclude = ["secrets/*", ".git/*", "**/public-key.txt"]

[default]
binary = false
check-filename = true
check-file = true
unicode = true
extend-ignore-re = [
  # Line ignore with trailling `(#|//|;;) spellchecker: disable-line`
  "(?Rm)^.*(#|//|;;)\\s*typochecker: disable-line$",
  # Line block with `(#|;;|//) spellchecker: (on|off)`
  "(?s)(#|//|;;)\\s*typochecker: off.*?\\n\\s*(#|//|;;)\\s*typochecker: on",
]
extend-ignore-identifiers-re = ["als", "Paket", "ConfiguratioN", "StructurE"]

[default.extend-identifiers]
