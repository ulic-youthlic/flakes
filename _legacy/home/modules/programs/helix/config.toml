[editor]
bufferline = "multiple"
color-modes = true
cursorcolumn = false
cursorline = true
default-line-ending = "lf"
line-number = "relative"
popup-border = "all"
true-color = true
undercurl = true
# letters in the beginning are used first
# move home raw letters to the beginning
jump-label-alphabet = "jkdls;aurieowpqnvmcxz"

[editor.statusline]
center = ["diagnostics"]
left = [
  "mode",
  "spacer",
  "version-control",
  "file-type",
  "separator",
  "read-only-indicator",
  "file-name",
  "file-modification-indicator",
  "spacer",
  "spinner",
]
mode.insert = "INSERT"
mode.normal = "NORMAL"
mode.select = "SELECT"
right = [
  "register",
  "file-line-ending",
  "file-encoding",
  "separator",
  "total-line-numbers",
  "position",
  "position-percentage",
]
separator = "|"

[editor.lsp]
display-inlay-hints = true
display-messages = true
display-progress-messages = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.whitespace.render]
nbsp = "all"
newline = "none"
space = "none"
tab = "all"

[editor.whitespace.characters]
nbsp = "⍽"
newline = "⏎"
space = "·"
tab = "→"
tabpad = "·"

[editor.indent-guides]
render = true

[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]
line-numbers.min-width = 1

[editor.soft-wrap]
enable = true

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "error"
prefix-len = 2
