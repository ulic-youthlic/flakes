[brightness]
enable_ddcutil = true

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000001"]

[desktop_widgets.grid]
cell_size = 8
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000001]
box_height = 112.0
box_width = 184.0
cx = 154.5
cy = 115.5
output = "eDP-1"
rotation = 0.0
type = "clock"

[dock]
background_opacity = 1.0

[hot_corners]
enabled = true

[hot_corners.top_right]
action = "launcher"

[keybinds]
down = ["Down", "Ctrl+n"]
up = ["Up", "Ctrl+p"]
validate = ["Return", "KP_Enter"]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 854.0
cy = 778.0
output = "eDP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[notification]
