position = "bottom_right"

[osd]
background_opacity = 0.9
border = false
position = "top_center"
position_vertical = "center_left"
scale = 0.8

[shell]
button_borders = false
card_borders = false
clipboard_history_max_entries = 10000
font_family = "Source Han Serif SC"
input_borders = false
lang = "zh-Hans"
launch_apps_as_systemd_services = true
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
popup_borders = false
screen_time_enabled = true
settings_window_translucent = true

[shell.animation]
speed = 2.0000000298023224

[shell.panel]
borders = false
