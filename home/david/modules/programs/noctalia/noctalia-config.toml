[accessibility]
ui_scale = 1.2000000104308128

[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.36999999172985554
tint_intensity = 0.99999997764825821

[bar.default]
background_opacity = 0.69999998435378075
center = ["workspaces"]
contact_shadow = true
end = [
  "brightness",
  "output_volume",
  "input_volume",
  "tray",
  "notifications",
  "battery",
  "date",
  "session",
]
font_weight = 200
margin_ends = 0
position = "right"
radius_bottom_right = 0
radius_top_right = 0
scale = 1.350000012665987
shadow = false
